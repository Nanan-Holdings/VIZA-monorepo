<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIZA Browser Interviewer Demo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07182d; }
    main { width: min(920px, 100%); min-height: 100vh; display: flex; flex-direction: column; background: #0c2d54; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #ffffff22; }
    .brand { font-weight: 800; letter-spacing: .08em; }
    .status { color: #a7f3d0; font-size: 12px; }
    .stage { position: relative; flex: 1; min-height: 560px; overflow: hidden; background: linear-gradient(160deg, #123f70, #07182d); }
    .stage:after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(transparent 40%, #07182de8); }
    .person { position: absolute; inset: 0; display: grid; place-items: end center; transform-origin: 50% 70%; }
    .person.speaking { animation: breathe 1.4s ease-in-out infinite; }
    img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
    .mouth { display: none; position: absolute; top: 39%; left: 50%; width: 20px; height: 5px; border-radius: 50%; background: #3d2530; border: 1px solid #ffffff88; transform: translateX(-50%); }
    .speaking .mouth { display: block; animation: mouth .32s ease-in-out infinite; }
    .hud, .question { position: absolute; z-index: 2; left: 22px; right: 22px; }
    .hud { top: 22px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    .pill { padding: 8px 11px; border-radius: 5px; background: #ffffffed; color: #12365c; }
    .live { color: #b7f7d1; background: #0b3a2d; }
    .question { bottom: 25px; }
    .eyebrow { margin: 0 0 7px; color: #ffffff88; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 42px); line-height: 1.2; }
    footer { display: flex; gap: 12px; padding: 18px 22px; background: #fff; }
    button { border: 0; border-radius: 7px; padding: 13px 18px; font: inherit; font-weight: 700; cursor: pointer; }
    #speak { color: white; background: #0b5cad; }
    #stop { color: #173654; background: #e7eef6; }
    .hint { margin-left: auto; align-self: center; color: #607086; font-size: 12px; }
    @keyframes breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.008); } }
    @keyframes mouth { 0%,100% { transform: translateX(-50%) scaleY(.6); opacity: .6; } 45% { transform: translateX(-50%) scaleY(1.35); opacity: 1; } }
    @media (max-width: 600px) { .stage { min-height: 500px; } .hint { display: none; } }
  </style>
</head>
<body>
  <main>
    <header><span class="brand">VIZA · MOCK INTERVIEW</span><span class="status">FREE BROWSER AVATAR</span></header>
    <section class="stage">
      <div class="hud"><span class="pill live">● LIVE VOICE</span><span class="pill">B1/B2 · QUESTION 1/8</span></div>
      <div id="person" class="person"><img src="/images/interview-officers/miller-public.jpg" alt="Consular officer"><span class="mouth" aria-hidden="true"></span></div>
      <div class="question"><p class="eyebrow">Current question</p><h1>你去美国做什么？</h1></div>
    </section>
    <footer><button id="speak">▶ 让面试官提问</button><button id="stop">■ 停止</button><span class="hint">Uses your browser voice. No HeyGen, API, or plugin.</span></footer>
  </main>
  <script>
    const person = document.querySelector('#person');
    const text = '你去美国做什么？';
    const speak = () => {
      if (!('speechSynthesis' in window)) { alert('Please use Chrome or Edge.'); return; }
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN'; utterance.rate = .9; utterance.pitch = .95;
      utterance.onstart = () => person.classList.add('speaking');
      utterance.onend = () => person.classList.remove('speaking');
      utterance.onerror = () => person.classList.remove('speaking');
      speechSynthesis.speak(utterance);
    };
    document.querySelector('#speak').addEventListener('click', speak);
    document.querySelector('#stop').addEventListener('click', () => { speechSynthesis.cancel(); person.classList.remove('speaking'); });
  </script>
</body>
</html>
