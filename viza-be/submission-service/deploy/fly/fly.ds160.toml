# Dedicated DS-160 (CEAC) worker. It runs in US East next to the CEAC
# Browserbase browser (us-east-1): every field fill is several worker<->browser
# round trips, so co-locating them cuts most of a run's latency. It claims only
# CEAC providers; the Singapore legacy worker denylists the same providers.
app = "viza-prod-submission-ds160"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5m"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # Shares the global runner_machine_slot capacity with the legacy worker.
  RUNNER_MACHINE_KIND = "legacy"
  SUBMISSION_SERVICE_LEGACY_QUEUE_ENABLED = "true"
  SUBMISSION_SERVICE_RUNNER_JOB_CONSUMER_ENABLED = "false"
  SUBMISSION_SERVICE_PROVIDER_ALLOWLIST = "ceac_live,ceac_proof,ceac_dry_run"
  SUBMISSION_SERVICE_IDLE_EXIT_MS = "120000"
  # Everything else stays on the legacy worker in Singapore.
  VN_CLOUD_QUEUE_ENABLED = "false"
  SUBMISSION_SERVICE_INDONESIA_QUEUE_ENABLED = "false"
  SUBMISSION_SERVICE_LEGACY_US_APPOINTMENT_POLL_ENABLED = "false"
  SUBMISSION_SERVICE_VN_STATUS_CHECKS_ENABLED = "false"
  # Applicant-authorized DS-160 jobs. Preserve the review and durable
  # final-submit guards when recovering drafts.
  DS160_SUBMISSION_MODE = "live_assisted"
  DS160_LIVE_SUBMISSION_ENABLED = "true"
  DS160_LIVE_ASSISTED_ONLY = "true"
  DS160_REQUIRE_FINAL_USER_CONFIRMATION = "true"
  DS160_REQUIRE_OFFICIAL_REVIEW_DIFF_PASS = "true"
  DS160_CEAC_BASE_URL = "https://ceac.state.gov/genniv/"
  DS160_PLAYWRIGHT_HEADLESS = "true"
  DS160_LIVE_MAX_DURATION_SECONDS = "3600"
  CEAC_BROWSERBASE_ENABLED = "true"
  # The managed US direct route was verified after the proxy route was blocked.
  CEAC_BROWSERBASE_PROXIES = "false"
  CEAC_BROWSERBASE_REGION = "us-east-1"
  CEAC_BROWSERBASE_COUNTRY = "US"
  CEAC_BROWSERBASE_TIMEOUT_SECONDS = "3600"
  BROWSERBASE_MAX_CONCURRENCY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  # Fly proxy starts a stopped Machine on any request (enqueue wake, /health
  # probe), so queued work is picked up even if the Machines API wake fails.
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[restart]]
  policy = "on-failure"
  retries = 10

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 4096
