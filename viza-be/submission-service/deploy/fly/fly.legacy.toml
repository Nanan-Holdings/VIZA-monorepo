# Dedicated legacy submission_queue consumer. Country workers must not enable it.
app = "viza-submission-legacy"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "5m"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  RUNNER_MACHINE_KIND = "legacy"
  SUBMISSION_SERVICE_LEGACY_QUEUE_ENABLED = "true"
  SUBMISSION_SERVICE_RUNNER_JOB_CONSUMER_ENABLED = "false"
  SUBMISSION_SERVICE_IDLE_EXIT_MS = "120000"
  # UK uses this retained Machine; fill only, with applicant declaration/pay handoff.
  UK_SUBMISSION_MODE = "live_assisted"
  UK_LIVE_SUBMISSION_ENABLED = "true"
  UK_PLAYWRIGHT_HEADLESS = "true"
  # Account creation remains an explicit operator gate (UK_REGISTER_COMMIT secret).
  # DS-160 runs on its own US East worker (fly.ds160.toml) next to the CEAC
  # browser. Needs claim RPC migration 0212; without it the denylist is not sent
  # successfully, so apply 0212 before deploying this.
  # France-Visas likewise runs on its own Frankfurt worker (fly.france.toml)
  # next to its eu-central-1 browser. France TLS appointment work stays here.
  SUBMISSION_SERVICE_PROVIDER_DENYLIST = "ceac_live,ceac_proof,ceac_dry_run,france_visas_live,france_visas_dry_run"
  # Applicant-authorized DS-160 jobs are claimed by this legacy worker.
  # Preserve the review and durable final-submit guards when recovering drafts.
  DS160_SUBMISSION_MODE = "live_assisted"
  DS160_LIVE_SUBMISSION_ENABLED = "true"
  DS160_LIVE_ASSISTED_ONLY = "true"
  DS160_REQUIRE_FINAL_USER_CONFIRMATION = "true"
  DS160_REQUIRE_OFFICIAL_REVIEW_DIFF_PASS = "true"
  DS160_CEAC_BASE_URL = "https://ceac.state.gov/genniv/"
  DS160_PLAYWRIGHT_HEADLESS = "true"
  DS160_LIVE_MAX_DURATION_SECONDS = "3600"
  CEAC_BROWSERBASE_ENABLED = "true"
  # The managed US direct route was verified after the proxy route was blocked.
  # Preserve the same-session, review and one-shot submission guards.
  CEAC_BROWSERBASE_PROXIES = "false"
  CEAC_BROWSERBASE_REGION = "us-east-1"
  CEAC_BROWSERBASE_COUNTRY = "US"
  CEAC_BROWSERBASE_TIMEOUT_SECONDS = "3600"
  BROWSERBASE_MAX_CONCURRENCY = "1"
  # Vietnam e-Visa live jobs use a cloud-only queue status and RPC that older
  # local workers cannot see or claim.
  VN_CLOUD_QUEUE_ENABLED = "true"
  # Fly has no X server. Vietnam must launch the bundled browser headlessly;
  # official fee checkpoints require attention.
  VN_PLAYWRIGHT_HEADLESS = "true"
  # The Playwright Fly image only guarantees its bundled Chromium binary.
  # Retry that browser for transient launch/portal failures instead of falling
  # through to host-installed Edge/Chrome channels that do not exist here.
  VN_BROWSER_CHANNELS = "bundled"
  # api.evisa.gov.vn currently presents an incomplete certificate chain to
  # container Chromium. Scope compatibility mode to the Vietnam browser only.
  VN_IGNORE_HTTPS_ERRORS = "true"
  # The Fly container has no X server. Indonesia payment continuation must
  # remain headless; 3DS/OTP is surfaced as a user checkpoint.
  INDONESIA_PLAYWRIGHT_HEADLESS = "true"
  # Fly has no interactive display. The MDAC worker must use the browser
  # provider configured through secrets (or its container Chromium) headlessly.
  MDAC_PLAYWRIGHT_HEADLESS = "true"
  MDAC_PLAYWRIGHT_CHANNEL = "bundled"
  # Philippines eTravel is Cloudflare-protected. The legacy worker must use
  # the authorized Browserbase session provider instead of container Chromium.
  PH_ETRAVEL_BROWSERBASE_ENABLED = "true"
  PH_ETRAVEL_BROWSERBASE_PROXIES = "true"
  PH_ETRAVEL_BROWSERBASE_COUNTRY = "PH"
  PH_ETRAVEL_BROWSERBASE_REGION = "ap-southeast-1"
  PH_ETRAVEL_PLAYWRIGHT_HEADLESS = "true"
  # The applicant-facing live queue is an explicit final-submit action. Local
  # smoke scripts remain safe by default and still require --submit.
  PH_ETRAVEL_STOP_BEFORE_SUBMIT = "false"
  # France TLS flags remain explicit production gates. Browserbase and the
  # shared internal token are Fly Secrets, never TOML values.
  FRANCE_TLS_ACCOUNT_REGISTRATION_ENABLED = "false"
  FRANCE_TLS_LOCAL_OFFICIAL_SESSION_ENABLED = "false"
  FRANCE_TLS_LIVE_BOOKING_ENABLED = "false"
  # France-Visas live prefill normally runs on the Frankfurt worker
  # (fly.france.toml; denylisted above). These settings mirror it so dropping
  # the denylist entries is enough to fall back to this worker.
  FRANCE_SUBMISSION_MODE = "live_assisted"
  FRANCE_LIVE_SUBMISSION_ENABLED = "true"
  FRANCE_PLAYWRIGHT_HEADLESS = "true"
  # France-Visas returns a blank page to the default (Singapore, no proxy)
  # Browserbase session. Use a Frankfurt session behind a French proxy, as the
  # local runs do, and keep it alive for the whole run limit.
  FRANCE_VISAS_BROWSERBASE_ENABLED = "true"
  FRANCE_VISAS_BROWSERBASE_PROXIES = "true"
  FRANCE_VISAS_BROWSERBASE_VERIFIED = "false"
  FRANCE_VISAS_BROWSERBASE_REGION = "eu-central-1"
  FRANCE_VISAS_BROWSERBASE_COUNTRY = "FR"
  FRANCE_VISAS_BROWSERBASE_TIMEOUT_SECONDS = "1800"
  FRANCE_ACCOUNT_REGISTRATION_ENABLED = "true"
  FRANCE_REGISTRATION_2CAPTCHA_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  # Fly proxy starts a stopped Machine on any request (enqueue wake,
  # /health probe), so queued work is picked up even if the Machines API
  # wake from Vercel fails. Idle Machines still exit on their own.
  auto_start_machines = true
  # Queue-depth autoscaling stops only after two safe deploy-readiness checks.
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    # Keep Fly ingress attached while Supabase has a transient outage. `/ready`
    # remains available for diagnostics, but the one-time card handoff must
    # still reach this live in-memory worker so the caller can retry safely.
    path = "/health"

[[restart]]
  policy = "on-failure"
  retries = 10

[[vm]]
  # Keep two CPUs and 4 GB for concurrent Playwright flows, but shared CPUs
  # avoid paying for dedicated performance cores while the queue is quiet.
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 4096
