# CI-003: typecheck + lint + build for the agent backend.
name: ci-agent-backend
on:
  pull_request:
    paths: ["viza-be/agent-backend/**", ".github/workflows/ci-agent-backend.yml"]
  push:
    branches: [main]
    paths: ["viza-be/agent-backend/**"]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: viza-be/agent-backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: viza-be/agent-backend/package-lock.json }
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build

  socket-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: viza-be/agent-backend } }
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: viza-be/agent-backend/package-lock.json }
      - run: npm ci
      - name: Verify Socket.IO cross-replica delivery through Redis
        run: npm run test:socket-scaling-integration
        env:
          SOCKET_IO_REDIS_INTEGRATION_URL: redis://127.0.0.1:6379
