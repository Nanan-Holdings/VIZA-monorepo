name: Automated product official-source drift

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: automated-product-source-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viza-be/agent-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viza-be/agent-backend/package-lock.json

      - run: npm ci

      - name: Check official sources
        id: drift
        shell: bash
        run: |
          npx tsx scripts/check-automated-product-source-drift.ts --weekly --json > "$RUNNER_TEMP/automated-product-source-drift.json"
          count="$(jq '.reviewNeeded | length' "$RUNNER_TEMP/automated-product-source-drift.json")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create or update manual review task
        if: steps.drift.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          DRIFT_REPORT_PATH: ${{ runner.temp }}/automated-product-source-drift.json
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.DRIFT_REPORT_PATH, 'utf8'));
            const title = '[Review] Japan VJW / Kenya eTA official-source drift';
            const body = [
              'The weekly official-source monitor detected changes. Production rules and runners were not updated.',
              '',
              '```json',
              JSON.stringify(report, null, 2).slice(0, 60000),
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
