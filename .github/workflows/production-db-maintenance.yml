name: Production database maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Explicit production maintenance action
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - pause

permissions:
  contents: read

concurrency:
  group: supabase-production-database-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Production database ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supabase-production-recovery

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run explicit production maintenance action
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PRODUCTION_DB_MAINTENANCE_ACTION: ${{ inputs.action }}
          PRODUCTION_DB_MAINTENANCE_CONFIRM: oyjxdzsoejraedqghndi:${{ inputs.action }}
        run: node scripts/production-db-maintenance.mjs
