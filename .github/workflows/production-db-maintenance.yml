name: Production database maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Maintenance action (currently read-only preflight only)
        required: true
        type: choice
        default: preflight
        options:
          - preflight

permissions:
  contents: read

concurrency:
  group: supabase-production-database-maintenance
  cancel-in-progress: false

jobs:
  preflight:
    name: Production database preflight
    if: inputs.action == 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supabase-production-recovery

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run aggregate-only production preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PRODUCTION_DB_MAINTENANCE_CONFIRM: oyjxdzsoejraedqghndi:preflight
        run: node scripts/production-db-maintenance.mjs
