name: Supabase production self-heal

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub Actions schedule delays.
    - cron: "2/5 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-production-self-heal
  cancel-in-progress: false

jobs:
  monitor:
    name: Probe and recover Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: supabase-production-recovery

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe Supabase and request recovery when safe
        id: monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTO_RESTART_ENABLED: ${{ vars.SUPABASE_AUTO_RESTART_ENABLED }}
          SUPABASE_SELF_HEAL_ISSUE_NUMBER: ${{ vars.SUPABASE_SELF_HEAL_ISSUE_NUMBER }}
        run: node scripts/supabase-self-heal.mjs
